<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SFPG Creative</title>
  <style>
    :root{
      --bg:#0b1220;
      --card:#111a2e;
      --text:#e8eefc;
      --muted:#aab6d6;
      --brand:#6ea8fe;
      --line:rgba(255,255,255,.08);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: Arial, Helvetica, sans-serif;
      background:linear-gradient(180deg,var(--bg),#070b14);
      color:var(--text);
    }
    header{
      position:sticky; top:0;
      background:rgba(11,18,32,.75);
      backdrop-filter: blur(10px);
      border-bottom:1px solid var(--line);
    }
    .container{max-width:980px; margin:0 auto; padding:0 16px;}
    nav{
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 0;
    }
    .brand{font-weight:800; letter-spacing:.3px;}
    .nav-links{display:flex; gap:14px; flex-wrap:wrap;}
    .nav-links a{
      color:var(--muted); text-decoration:none; font-size:14px;
      padding:8px 10px; border-radius:10px;
      border:1px solid transparent;
    }
    .nav-links a:hover{
      color:var(--text);
      border-color:var(--line);
      background:rgba(255,255,255,.03);
    }
    .hero{
      padding:48px 0 24px;
    }
    .hero-grid{
      display:grid; gap:18px;
      grid-template-columns: 1.2fr .8fr;
      align-items:center;
    }
    @media (max-width: 860px){
      .hero-grid{grid-template-columns:1fr}
    }
    .tag{
      display:inline-block;
      padding:8px 12px;
      border:1px solid var(--line);
      border-radius:999px;
      color:var(--muted);
      margin-bottom:14px;
      background:rgba(255,255,255,.03);
    }
    h1{margin:0 0 12px; font-size:38px; line-height:1.1;}
    p{color:var(--muted); margin:0 0 18px; line-height:1.6;}
    .btn-row{display:flex; gap:10px; flex-wrap:wrap;}
    .btn{
      display:inline-flex; align-items:center; justify-content:center;
      padding:12px 16px; border-radius:12px; text-decoration:none;
      font-weight:700;
    }
    .btn-primary{background:var(--brand); color:#071122;}
    .btn-secondary{
      border:1px solid var(--line);
      background:rgba(255,255,255,.03);
      color:var(--text);
    }
    section{padding:26px 0;}
    .section-title{
      font-size:20px; margin:0 0 10px;
    }
    .card{
      background:rgba(255,255,255,.03);
      border:1px solid var(--line);
      border-radius:16px;
      padding:16px;
    }
    .grid-3{
      display:grid; gap:12px;
      grid-template-columns: repeat(3, 1fr);
    }
    @media (max-width: 860px){
      .grid-3{grid-template-columns:1fr}
    }
    .service h3{margin:10px 0 6px; font-size:16px;}
    .service p{margin:0}
    .two-col{
      display:grid; gap:14px; grid-template-columns: 1fr 1fr;
    }
    @media (max-width: 860px){ .two-col{grid-template-columns:1fr} }
    footer{
      padding:26px 0 40px; color:var(--muted);
      border-top:1px solid var(--line);
      margin-top:20px;
    }
    .form-row{display:grid; gap:10px; grid-template-columns:1fr 1fr;}
    @media (max-width: 560px){ .form-row{grid-template-columns:1fr} }
    input, textarea{
      width:100%;
      padding:12px 12px;
      border-radius:12px;
      border:1px solid var(--line);
      background:rgba(0,0,0,.15);
      color:var(--text);
      outline:none;
    }
    textarea{min-height:120px; resize:vertical;}
    input::placeholder, textarea::placeholder{color:var(--muted)}
    .small{font-size:12px; color:var(--muted)}
  </style>
</head>
<body>
<header>
  <div class="container">
    <nav>
      <div class="brand">SFPG Creative</div>
      <div class="nav-links">
        <a href="#home">Accueil</a>
        <a href="#services">Services</a>
        <a href="#about">À propos</a>
        <a href="#contact">Contact</a>
      </div>
    </nav>
  </div>
</header>

<main class="container">
  <div id="home" class="hero">
    <div class="hero-grid">
      <div>
        <div class="tag">Design • Contenu • Créativité</div>
        <h1>Une présence en ligne professionnelle pour votre marque.</h1>
        <p>
          Je crée des designs et contenus pour aider vos idées à devenir visibles.
          Contactez-moi et discutons de votre projet.
        </p>
        <div class="btn-row">
          <a class="btn btn-primary" href="#contact">Demander un devis</a>
          <a class="btn btn-secondary" href="https://www.facebook.com/sfpg.creative" target="_blank" rel="noopener">Voir Facebook</a>
        </div>
      </div>
      <div class="card">
        <h3 class="section-title" style="margin-top:0;">Résumé rapide</h3>
        <p style="margin:0 0 12px;">
          ✅ Réponses rapides<br/>
          ✅ Travail propre et soigné<br/>
          ✅ Livraison selon vos besoins
        </p>
        <div class="small">Astuce: Remplacez cette section par vos infos réelles.</div>
      </div>
    </div>
  </div>

  <section id="services">
    <h2 class="section-title">Services</h2>
    <div class="grid-3">
      <div class="card service">
        <div style="font-size:34px;">🎨</div>
        <h3>Graphisme</h3>
        <p>Flyers, affiches, logos, branding (template).</p>
      </div>
      <div class="card service">
        <div style="font-size:34px;">📱</div>
        <h3>Contenu social media</h3>
        <p>Posts, bannières, stories, concepts visuels.</p>
      </div>
      <div class="card service">
        <div style="font-size:34px;">🎬</div>
        <h3>Montage vidéo</h3>
        <p>Reels / vidéos courtes pour promouvoir votre activité.</p>
      </div>
    </div>
  </section>

  <section id="about">
    <h2 class="section-title">À propos</h2>
    <div class="two-col">
      <div class="card">
        <p>
          Je suis <b>SFPG Creative</b>. Mon objectif: créer des visuels modernes et impactants
          qui attirent l’attention et renforcent votre image de marque.
        </p>
      </div>
      <div class="card">
        <p>
          Vous avez déjà une idée ? Envoyez-moi: votre objectif, votre style (exemples si possible),
          et la date de livraison souhaitée.
        </p>
      </div>
    </div>
  </section>

  <section id="contact">
    <h2 class="section-title">Contact</h2>
    <div class="card">
      <form onsubmit="event.preventDefault(); alert('Merci ! Remplacez ce bouton par votre système de contact (email/WhatsApp).');">
        <div class="form-row">
          <input type="text" placeholder="Votre nom" required />
          <input type="email" placeholder="Votre email" required />
        </div>
        <div style="height:10px"></div>
        <input type="text" placeholder="Objet (ex: Logo pour mon business)" />
        <div style="height:10px"></div>
        <textarea placeholder="Décrivez votre projet..." required></textarea>
        <div style="height:12px"></div>
        <button class="btn btn-primary" type="submit" style="border:none; cursor:pointer;">Envoyer</button>
        <div class="small" style="margin-top:8px;">
          Pour recevoir réellement les messages: on peut connecter la page à Email/WhatsApp.
        </div>
      </form>
    </div>
  </section>
</main>

<footer>
  <div class="container">
    <div>© <span id="year"></span> SFPG Creative • Tous droits réservés</div>
    <div style="margin-top:6px;">Site simple • Remplacez le contenu par vos infos.</div>
  </div>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
